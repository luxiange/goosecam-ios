name: GooseCam
options:
  bundleIdPrefix: com.luxiangge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  GooseCam:
    type: application
    platform: iOS
    sources:
      - path: GooseCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luxiangge.goosecam
        PRODUCT_NAME: GooseCam
        INFOPLIST_FILE: GooseCam/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.40"
        CURRENT_PROJECT_VERSION: "32"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
